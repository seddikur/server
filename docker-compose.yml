services:
  web:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: yii2-php:8.2-fpm-nginx
    container_name: yii2_web
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: mydb
      DB_USER: user
      DB_PASSWORD: password
      XDEBUG_MODE: "off"
      YII_ENV: local
    command: >
      bash -c "test -f config/db.php || cp config/db.php.example config/db.php;
      php-fpm"
    networks:
      - yii2_net

  nginx:
    image: nginx:1.25-alpine
    container_name: yii2_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - yii2_net

  db:
    image: mysql:5.7.34
    container_name: yii2_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - yii2_net

volumes:
  mysql_data:

networks:
  yii2_net:
    driver: bridge
